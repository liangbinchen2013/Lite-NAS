<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{nas_name}} - Login</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; background: #f5f5f5; color: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
.login-box { background: #fff; border-radius: 12px; padding: 48px 40px; width: 380px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
h1 { font-size: 24px; margin-bottom: 8px; color: #333; text-align: center; }
.subtitle { color: #888; margin-bottom: 32px; font-size: 14px; text-align: center; }
.form-group { margin-bottom: 20px; }
label { display: block; margin-bottom: 6px; font-size: 14px; color: #555; }
input[type="text"], input[type="password"] { width: 100%; padding: 10px 14px; background: #f9f9f9; border: 1px solid #ddd; border-radius: 6px; color: #333; font-size: 14px; outline: none; transition: border-color 0.2s; }
input[type="text"]:focus, input[type="password"]:focus { border-color: #3b82f6; background: #fff; }
button { width: 100%; padding: 10px; background: #3b82f6; color: white; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; transition: background 0.2s; }
button:hover { background: #2563eb; }
.error { color: #dc2626; margin-bottom: 16px; font-size: 13px; text-align: center; }
</style>
</head>
<body>
<div class="login-box">
  <h1>{{nas_name}}</h1>
  <p class="subtitle">请输入用户名和密码</p>
  <form method="POST" action="/login">
    <div class="form-group">
      <label for="username">用户名</label>
      <input type="text" id="username" name="username" placeholder="请输入用户名" autofocus>
    </div>
    <div class="form-group">
      <label for="password">密码</label>
      <input type="password" id="password" name="password" placeholder="请输入密码">
    </div>
    <button type="submit">登录</button>
  </form>
</div>
</body>
</html>
